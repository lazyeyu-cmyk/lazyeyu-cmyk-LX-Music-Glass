name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Locate project and unzip if needed
        shell: bash
        run: |
          set -e

          if [ -f gradlew ]; then
            PROJECT_DIR="."
            echo "根目录已有 gradlew，直接构建"
          else
            ZIP_FILE=$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)

            if [ -z "$ZIP_FILE" ]; then
              echo "::error::根目录没有 gradlew，也没有找到 .zip 源码包"
              exit 1
            fi

            echo "发现压缩包：$ZIP_FILE，开始解压"
            rm -rf _src
            mkdir -p _src
            unzip -q "$ZIP_FILE" -d _src

            GRADLEW=$(find _src -type f -name gradlew | head -n 1)

            if [ -z "$GRADLEW" ]; then
              echo "::error::解压后仍未找到 gradlew，请检查 ZIP 内是否是 Android 项目"
              exit 1
            fi

            PROJECT_DIR=$(dirname "$GRADLEW")
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "项目目录：$PROJECT_DIR"

      - name: Grant execute permission for gradlew
        run: chmod +x "$PROJECT_DIR/gradlew"

      - name: Build Release APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: |
            **/build/outputs/apk/release/*.apk
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
